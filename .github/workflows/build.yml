# Compila el plugin en cada push y pull request. Al subir una etiqueta vX.Y.Z (que debe
# coincidir con <Version> del csproj) crea una release de GitHub con el zip, su SHA-256 y la
# entrada para la lista oficial de plugins de Notepad++ (nppPluginList).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NativeAOT necesita el enlazador de C++ de Visual Studio, ya instalado en windows-latest.
      - name: Compilar
        shell: pwsh
        run: ./build.ps1

      - name: Empaquetar
        shell: pwsh
        run: ./package.ps1

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content dist/release/version.txt -Raw).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "La etiqueta $env:GITHUB_REF_NAME no coincide con la versión $version de SshOpen.csproj"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SshOpen-x64
          path: |
            dist/release/*.zip
            dist/release/*.sha256
            dist/release/nppPluginList-entry.json
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SshOpen-x64
          path: dist

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "SshOpen $GITHUB_REF_NAME" --generate-notes
